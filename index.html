<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      (() => {
        let saved;
        try {
          saved = localStorage.getItem("conjumate-theme");
        } catch {}
        const theme =
          saved === "light" || saved === "dark"
            ? saved
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content =
          theme === "dark" ? "#101719" : "#ffffff";
      })();
    </script>
    <title>ConjuMate — Conjugate and Translate, Without Changing Tabs</title>
    <meta
      name="description"
      content="Get translations and verb conjugations right where you read with ConjuMate for Chrome. Italian available now; Spanish, French, and Portuguese coming soon."
    />
    <link rel="canonical" href="https://conjumate.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ConjuMate" />
    <meta property="og:url" content="https://conjumate.com/" />
    <meta
      property="og:title"
      content="ConjuMate — Conjugate and Translate, Without Changing Tabs"
    />
    <meta
      property="og:description"
      content="Translations and verb conjugations, right where you read. ConjuMate for Chrome."
    />
    <meta
      property="og:image"
      content="https://conjumate.com/social-preview.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="ConjuMate. Conjugate and Translate, Without Changing Tabs."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="ConjuMate — Conjugate and Translate, Without Changing Tabs"
    />
    <meta
      name="twitter:description"
      content="Translations and verb conjugations, right where you read. Italian available now."
    />
    <meta
      name="twitter:image"
      content="https://conjumate.com/social-preview.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700;750&display=swap"
      rel="stylesheet"
    />
  </head>

    <div id="root"></div>

  </body>
</html>
